<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リンクページ</title>
<style>
:root{--bg:#f3f6f4;--surface:#fff;--ink:#16221d;--sub:#5a6a63;--line:#d5dfda;--accent:#1f6f54;--accent-ink:#fff;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--surface:#18231f;--ink:#e9f1ed;--sub:#9fb2a9;--line:#2c3d36;--accent:#4fc197;--accent-ink:#06261b;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1714;--surface:#18231f;--ink:#e9f1ed;--sub:#9fb2a9;--line:#2c3d36;--accent:#4fc197;--accent-ink:#06261b;--danger:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
.page{max-width:480px;margin:0 auto;padding:0 0 120px}
.hero{aspect-ratio:16/10;background:linear-gradient(135deg,var(--accent),var(--line));background-size:cover;background-position:center;display:flex;align-items:flex-end}
.hero span{margin:12px;font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:2px 10px;border-radius:99px}
.hero{position:relative}
.pv{aspect-ratio:16/6;border-radius:12px;position:sticky;top:0;z-index:2;margin:6px 0;overflow:hidden}
.pv .ht{padding:10px}
.hero.dk::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.ht{position:absolute;inset:0;display:flex;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:800;line-height:1.4;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);z-index:1}
.head{padding:24px 20px 4px}
h1{font-size:26px;line-height:1.35;margin:0 0 6px;letter-spacing:.02em}
.sum{margin:0;color:var(--accent);font-weight:700;font-size:15px}
.blk{padding:16px 20px 4px}
.blk h2{font-size:18px;margin:0 0 6px}
.blk p{white-space:pre-wrap;margin:0;font-size:15px}
.blk img{width:100%;border-radius:14px;display:block}
.blk figcaption{font-size:13px;color:var(--sub);margin-top:6px}
.blk figure{margin:0}
.grid{display:grid;gap:12px;margin-top:8px}
.card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none}
.card:active{transform:scale(.99)}
.badge{flex:none;width:44px;height:44px;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.card b{display:block;font-size:15px;line-height:1.4}
.card small{display:block;color:var(--sub);font-size:12px;overflow-wrap:anywhere}
.win{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;margin-top:8px}
.win .wh{display:flex;align-items:center;gap:10px;padding:12px 14px}
.win .wi{aspect-ratio:16/9;background:var(--line);display:grid;place-items:center;color:var(--sub);font-size:12px;text-align:center;padding:12px}
.empty{color:var(--sub);text-align:center;padding:24px 16px;font-size:14px}
.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:14px 22px;font:700 15px inherit;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:90%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar h2{font-size:17px;margin:0}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 4px}
input,textarea{width:100%;font:16px inherit;font-family:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
button{font-family:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.del{color:var(--danger)}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.bh{display:flex;gap:6px;align-items:center}
.bh b{flex:1;font-size:14px}
.sub{border-top:1px dashed var(--line);margin-top:10px;padding-top:2px}
.acts{display:flex;gap:6px;margin-top:8px;align-items:center}
.acts .tag{flex:1;font-size:12px;color:var(--sub)}
.adds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.note{font-size:12px;color:var(--sub);margin:6px 0 0}
.lock{padding:8px 0}
.err{color:var(--danger);font-size:13px;min-height:20px;margin:6px 0 0}
</style>
</head>
<body>
<main class="page">
  <div class="hero" id="hero"><span>メイン画像</span><div class="ht" id="ht"></div></div>
  <div class="head"><h1 id="vName"></h1><p class="sum" id="vSum"></p></div>
  <div id="vBlocks"></div>
</main>
<button class="fab" id="fab">編集する</button>
 
<div class="sheet" id="sheet">
  <div class="panel">
    <div id="lock" class="lock">
      <div class="bar"><h2>編集用パスワード</h2><button class="btn" data-close>閉じる</button></div>
      <input type="password" id="pwIn" placeholder="パスワードを入力" autocomplete="off">
      <p class="err" id="pwErr"></p>
      <button class="btn main" id="pwGo" style="width:100%">編集をはじめる</button>
      
    </div>
    <div id="edit" hidden>
      <div class="bar"><h2>ページを編集</h2><button class="btn main" data-close>完了</button></div>
      <p class="note">変更はすぐ画面に反映されます。編集内容は自動で保存されます。</p>
      <div class="hero pv" id="pv"><div class="ht" id="pt"></div></div>
      <label>メイン画像</label>
      <input type="file" id="img" accept="image/*">
      <div id="hg"></div>
      <label>会社名</label><input id="eName">
      <label>ひとこと概要</label><input id="eSum">
      <label>色</label><div id="gc"></div>
      <label>ブロック(上から順に表示されます)</label>
      <div id="blocks"></div>
      <div class="adds" style="grid-template-columns:repeat(2,1fr)">
        <button class="btn" data-add="post">＋投稿(X・Threads)</button>
        <button class="btn" data-add="text">＋文章</button>
        <button class="btn" data-add="image">＋画像</button>
        <button class="btn" data-add="links">＋リンク</button>
      </div>
      <p class="err" id="saveErr"></p>
      <label>編集用パスワードを変更</label>
      <input id="ePw" placeholder="新しいパスワード" autocomplete="off">
      <button class="btn del" id="reset" style="margin-top:18px;width:100%">サンプルの内容に戻す</button>
    </div>
  </div>
</div>
 
<script>
var KEY="peraichi-demo-v2";
var SAMPLE={name:"さくら食堂",sum:"名古屋・栄の家庭料理のお店",hero:"",blocks:[
{t:"text",title:"お店について",body:"毎朝仕入れる旬の野菜と、土鍋で炊くごはんが自慢です。\nお席のご予約はLINEでも受け付けています。"},
{t:"post",title:"Xの最新投稿",url:""},
{t:"post",title:"Threadsの最新投稿",url:""},
{t:"links",title:"ここからも見られます",links:[{url:"https://www.instagram.com/sakura_shokudo",label:"今日のごはん"},{url:"https://lin.ee/example",label:"LINEで予約"},{url:"",label:""}]},
{t:"text",title:"営業時間",body:"ランチ 11:30〜14:00\nディナー 17:30〜22:00\n定休日:月曜"}]};
var S=[{m:/^(x|twitter)\.com$/,n:"X",c:"#111",l:"X"},{m:/^threads\.(net|com)$/,n:"Threads",c:"#333",l:"@"},{m:/instagram\.com$/,n:"Instagram",c:"#d6249f",l:"IG"},{m:/^(line\.me|lin\.ee)$/,n:"LINE",c:"#06c755",l:"L"},{m:/(youtube\.com|youtu\.be)$/,n:"YouTube",c:"#e00",l:"▶"},{m:/facebook\.com$/,n:"Facebook",c:"#1877f2",l:"f"},{m:/tiktok\.com$/,n:"TikTok",c:"#111",l:"♪"},{m:/^maps\.app\.goo\.gl$/,n:"Googleマップ",c:"#1a73e8",l:"MAP"}];
var LABEL={text:"文章ブロック",image:"画像ブロック",links:"リンクブロック",post:"投稿ブロック"};
var st=clone(SAMPLE),authed=false,PW="",tm=0;
function clone(o){return JSON.parse(JSON.stringify(o))}
function save(){clearTimeout(tm);tm=setTimeout(function(){fetch("/api/page",{method:"POST",headers:{"content-type":"application/json","x-pw":PW},body:JSON.stringify(st)}).then(function(r){$("saveErr").textContent=r.ok?"":"保存できませんでした。もう一度お試しください。"}).catch(function(){$("saveErr").textContent="通信できませんでした。"})},600)}
function $(i){return document.getElementById(i)}
function fix(u){u=(u||"").trim();if(!u)return"";return/^https?:\/\//.test(u)?u:"https://"+u}
function svc(u){try{var x=new URL(fix(u)),h=x.hostname.replace(/^www\./,"");if(h==="google.com"&&x.pathname.indexOf("/maps")===0)return{n:"Googleマップ",c:"#1a73e8",l:"MAP",h:h};for(var i=0;i<S.length;i++)if(S[i].m.test(h))return{n:S[i].n,c:S[i].c,l:S[i].l,h:h};return{n:h,c:"#4a5a54",l:h.charAt(0).toUpperCase(),h:h}}catch(e){return null}}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function mv(a,i,d){var j=i+d;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t;save();blocks();view()}
function esc(u){return String(u).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function embedHtml(v,u){u=fix(u);if(v.n==="X"){u=u.replace("//x.com","//twitter.com");return `<blockquote class="twitter-tweet" data-dnt="true"><a href="${esc(u)}">${esc(u)}</a></blockquote>`}return `<blockquote class="text-post-media" data-text-post-permalink="${esc(u)}" data-text-post-version="0"><a href="${esc(u)}">${esc(u)}</a></blockquote>`}
function lib(id,src){var o=document.getElementById(id);if(o)o.remove();var e=document.createElement("script");e.id=id;e.async=true;e.src=src;document.head.appendChild(e)}
function embeds(){if(window.twttr&&window.twttr.widgets)window.twttr.widgets.load($("vBlocks"));else if(!document.getElementById("twl"))lib("twl","https://platform.twitter.com/widgets.js");if(document.querySelector(".text-post-media"))lib("thr","https://www.threads.net/embed.js")}
function view(){
  $("vName").textContent=st.name||"会社名";$("vSum").textContent=st.sum||"";$("vName").style.color=st.cName||"";$("vSum").style.color=st.cSum||"";document.body.style.background=st.bg||"";
  var h=$("hero");h.style.backgroundImage=st.hero?"url("+st.hero+")":"";h.firstChild.style.display=st.hero?"none":"";var ht=$("ht");ht.textContent=st.ht||"";ht.style.color=st.hc||"";ht.style.alignItems=st.hp==="t"?"flex-start":st.hp==="m"?"center":"flex-end";ht.style.fontSize=(st.hs||24)+"px";h.classList.toggle("dk",!!st.hd);var pv=$("pv");pv.style.backgroundImage=h.style.backgroundImage;pv.classList.toggle("dk",!!st.hd);var pt=$("pt");pt.textContent=ht.textContent;pt.style.color=ht.style.color;pt.style.alignItems=ht.style.alignItems;pt.style.fontSize=((st.hs||24)*.55)+"px";
  var box=$("vBlocks");box.textContent="";var n=0,emb=0;
  st.blocks.forEach(function(b){var s=el("section","blk");
    if(b.t==="text"){if(!b.title&&!b.body)return;if(b.title)s.appendChild(tc(el("h2",null,b.title),b.ct));if(b.body)s.appendChild(tc(el("p",null,b.body),b.cb))}
    else if(b.t==="post"){var v=svc(b.url);if(!v)return;if(b.title)s.appendChild(tc(el("h2",null,b.title),b.ct));if(!/\/(status|post)\/[\w-]+/.test(b.url||""))return;var hd=el("div");hd.innerHTML=embedHtml(v,b.url);s.appendChild(hd);emb=1}
    else if(b.t==="image"){if(!b.src)return;var f=el("figure"),im=el("img");im.src=b.src;im.alt=b.cap||"";f.appendChild(im);if(b.cap)f.appendChild(el("figcaption",null,b.cap));s.appendChild(f)}
    else{var g=el("div","grid"),k=0;b.links.forEach(function(l){var v=svc(l.url);if(!v)return;k++;
      var a=el("a","card");a.href=fix(l.url);a.target="_blank";a.rel="noopener";
      var bd=el("div","badge",v.l);bd.style.background=v.c;if(v.l.length>2)bd.style.fontSize="11px";
      var t=el("div");t.appendChild(el("b",null,l.label||v.n));t.appendChild(el("small",null,v.h));
      a.appendChild(bd);a.appendChild(t);g.appendChild(a)});
      if(!k)return;if(b.title)s.appendChild(tc(el("h2",null,b.title),b.ct));s.appendChild(g)}
    n++;box.appendChild(s)});
  if(emb)embeds();
  if(!n)box.appendChild(el("div","empty","ブロックはまだありません。「編集する」から追加できます。"));
}
function linkRows(b,host){
  b.links.forEach(function(l,i){
    var r=el("div","sub"),u=el("input");u.placeholder="URLを貼り付け";u.value=l.url;u.inputMode="url";u.style.marginTop="8px";
    var lb=el("input");lb.placeholder="表示名(空ならサービス名)";lb.value=l.label;lb.style.marginTop="6px";
    var tag=el("span","tag");
    function tg(){var s=svc(u.value);tag.textContent=u.value.trim()?(s?"認識: "+s.n:"URLを確認してください"):"未入力"}
    u.oninput=function(){l.url=u.value;tg();save();view()};lb.oninput=function(){l.label=lb.value;save();view()};tg();
    var up=el("button","btn","↑"),dn=el("button","btn","↓"),dl=el("button","btn del","削除");
    up.onclick=function(){mv(b.links,i,-1)};dn.onclick=function(){mv(b.links,i,1)};dl.onclick=function(){b.links.splice(i,1);save();blocks();view()};
    var a=el("div","acts");a.appendChild(tag);a.appendChild(up);a.appendChild(dn);a.appendChild(dl);
    r.appendChild(u);r.appendChild(lb);r.appendChild(a);host.appendChild(r)});
  var ad=el("button","btn","リンク欄を追加");ad.style.cssText="width:100%;margin-top:10px";
  ad.onclick=function(){b.links.push({url:"",label:""});save();blocks()};host.appendChild(ad);
}
function tc(e,c){if(c)e.style.color=c;return e}
function colorRow(host,lab,obj,key,def){var w=el("div","acts"),c=el("input"),r=el("button","btn","標準");c.type="color";c.value=obj[key]||def;c.style.cssText="width:56px;height:40px;padding:2px;flex:none";c.oninput=function(){obj[key]=c.value;save();view()};r.onclick=function(){obj[key]="";c.value=def;save();view()};w.appendChild(el("span","tag",lab));w.appendChild(c);w.appendChild(r);host.appendChild(w)}
function choice(host,lab,key,opts){host.appendChild(el("label",null,lab));var w=el("div","adds"),def=opts.filter(function(o){return o[2]})[0][0];function paint(){var cur=st[key]==null?def:st[key];[].forEach.call(w.children,function(b,k){b.className="btn"+(cur===opts[k][0]?" main":"")})}opts.forEach(function(o){var b=el("button","btn",o[1]);b.onclick=function(){st[key]=o[0];save();view();paint()};w.appendChild(b)});paint();host.appendChild(w)}
function field(host,lab,node){host.appendChild(el("label",null,lab));host.appendChild(node)}
function blocks(){
  var box=$("blocks");box.textContent="";
  st.blocks.forEach(function(b,i){
    var r=el("div","row"),h=el("div","bh");h.appendChild(el("b",null,LABEL[b.t]));
    var up=el("button","btn","↑"),dn=el("button","btn","↓"),dl=el("button","btn del","削除");
    up.onclick=function(){mv(st.blocks,i,-1)};dn.onclick=function(){mv(st.blocks,i,1)};
    dl.onclick=function(){if(dl.dataset.s){st.blocks.splice(i,1);save();blocks();view();return}dl.dataset.s="1";dl.textContent="本当に削除";setTimeout(function(){dl.dataset.s="";dl.textContent="削除"},3000)};
    h.appendChild(up);h.appendChild(dn);h.appendChild(dl);r.appendChild(h);
    if(b.t==="text"){
      var t=el("input");t.value=b.title||"";t.oninput=function(){b.title=t.value;save();view()};field(r,"見出し",t);colorRow(r,"見出しの色",b,"ct","#16221d");
      var x=el("textarea");x.value=b.body||"";x.oninput=function(){b.body=x.value;save();view()};field(r,"本文",x);colorRow(r,"本文の色",b,"cb","#16221d")}
    else if(b.t==="image"){
      var f=el("input");f.type="file";f.accept="image/*";
      f.onchange=function(){var file=f.files[0];if(!file)return;var rd=new FileReader();
        rd.onload=function(){var im=new Image();im.onload=function(){var w=Math.min(900,im.width),c=document.createElement("canvas");c.width=w;c.height=im.height*w/im.width;c.getContext("2d").drawImage(im,0,0,c.width,c.height);b.src=c.toDataURL("image/jpeg",.78);save();blocks();view()};im.src=rd.result};rd.readAsDataURL(file)};
      field(r,b.src?"画像(選び直すと差し替え)":"画像を選ぶ",f);
      if(b.src){var pv=el("img");pv.src=b.src;pv.style.cssText="width:100%;border-radius:10px;margin-top:8px";r.appendChild(pv)}
      var c=el("input");c.value=b.cap||"";c.oninput=function(){b.cap=c.value;save();view()};field(r,"キャプション(任意)",c)}
    else if(b.t==="post"){
      var pt2=el("input");pt2.value=b.title||"";pt2.oninput=function(){b.title=pt2.value;save();view()};field(r,"見出し",pt2);
      var pu=el("input");pu.placeholder="投稿のURLを貼り付け";pu.inputMode="url";pu.value=b.url||"";var pg=el("p","note");
      function ptg(){var s=svc(pu.value);pg.textContent=pu.value.trim()?(s?(s.n==="X"||s.n==="Threads"?"認識: "+s.n+(/\/(status|post)\//.test(pu.value)?"の投稿":"(投稿のURLではないかもしれません)"):"この欄はXとThreads用です。InstagramやLINEは「＋リンク」へ"):"URLを確認してください"):"新しい投稿に変えるときは、このURLを貼り替えるだけです"}
      pu.oninput=function(){b.url=pu.value;ptg();save()};pu.onchange=function(){view()};ptg();field(r,"投稿のURL",pu);r.appendChild(pg)}
    else{
      var t2=el("input");t2.value=b.title||"";t2.oninput=function(){b.title=t2.value;save();view()};field(r,"見出し",t2);colorRow(r,"見出しの色",b,"ct","#16221d");
      linkRows(b,r)}
    box.appendChild(r)});
}
function fill(){$("eName").value=st.name;$("eSum").value=st.sum;$("ePw").value="";var g=$("gc");g.textContent="";colorRow(g,"会社名の色",st,"cName","#16221d");colorRow(g,"概要の色",st,"cSum","#1f6f54");colorRow(g,"背景の色",st,"bg","#f3f6f4");var hg=$("hg");hg.textContent="";hg.appendChild(el("label",null,"画像の上の文字(任意)"));var ta=el("textarea");ta.placeholder="例: 旬の味を、毎日。";ta.style.minHeight="64px";ta.value=st.ht||"";ta.oninput=function(){st.ht=ta.value;save();view()};hg.appendChild(ta);colorRow(hg,"文字の色",st,"hc","#ffffff");choice(hg,"文字の位置","hp",[["t","上"],["m","中央"],["b","下",1]]);choice(hg,"文字の大きさ","hs",[[18,"小"],[24,"中",1],[32,"大"]]);choice(hg,"画像の明るさ(文字を読みやすく)","hd",[[false,"そのまま",1],[true,"少し暗くする"]]);blocks()}
function open_(){$("sheet").classList.add("on");$("lock").hidden=authed;$("edit").hidden=!authed;$("pwErr").textContent="";$("pwIn").value="";if(authed)fill()}
function close_(){$("sheet").classList.remove("on")}
$("fab").onclick=open_;if(location.hash!=="#edit")$("fab").style.display="none";window.onhashchange=function(){$("fab").style.display=location.hash==="#edit"?"":"none"};
document.querySelectorAll("[data-close]").forEach(function(b){b.onclick=close_});
$("sheet").onclick=function(e){if(e.target===$("sheet"))close_()};
function go(){var p=$("pwIn").value;fetch("/api/login",{method:"POST",headers:{"x-pw":p}}).then(function(r){if(r.ok){PW=p;authed=true;open_()}else $("pwErr").textContent="パスワードが違います。もう一度入力してください。"}).catch(function(){$("pwErr").textContent="通信できませんでした。"})}
$("pwGo").onclick=go;$("pwIn").onkeydown=function(e){if(e.key==="Enter")go()};
$("eName").oninput=function(){st.name=this.value;save();view()};
$("eSum").oninput=function(){st.sum=this.value;save();view()};
$("ePw").onchange=function(){var n=this.value;if(!n)return;fetch("/api/password",{method:"POST",headers:{"content-type":"application/json","x-pw":PW},body:JSON.stringify({pw:n})}).then(function(r){if(r.ok){PW=n;$("ePw").value="";$("saveErr").textContent="パスワードを変更しました。"}else $("saveErr").textContent="変更できませんでした。6文字以上にしてください。"})};
document.querySelectorAll("[data-add]").forEach(function(b){b.onclick=function(){var t=b.getAttribute("data-add");
  st.blocks.push(t==="text"?{t:t,title:"",body:""}:t==="image"?{t:t,src:"",cap:""}:t==="post"?{t:t,title:"最新の投稿",url:""}:{t:t,title:"",links:[{url:"",label:""},{url:"",label:""},{url:"",label:""}]});
  save();blocks();view()}});
$("reset").onclick=function(){var b=$("reset");if(b.dataset.s){b.dataset.s="";b.textContent="サンプルの内容に戻す";st=clone(SAMPLE);save();fill();view();return}b.dataset.s="1";b.textContent="本当に戻す(もう一度押す)";setTimeout(function(){b.dataset.s="";b.textContent="サンプルの内容に戻す"},3000)};
$("img").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){var w=Math.min(1000,im.width),c=document.createElement("canvas");c.width=w;c.height=im.height*w/im.width;c.getContext("2d").drawImage(im,0,0,c.width,c.height);st.hero=c.toDataURL("image/jpeg",.8);save();view()};im.src=r.result};r.readAsDataURL(f)};
fetch("/api/page").then(function(r){return r.json()}).then(function(d){if(d&&d.blocks)st=d}).catch(function(){}).then(view);
</script>
</body>
</html>
